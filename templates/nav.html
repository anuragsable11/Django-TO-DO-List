{% with current=request.resolver_match.url_name %}
<header class="site-header">
    <div class="container site-header-inner">
        <a class="logo" href="{% url 'landing' %}">
            <svg class="logo-mark" aria-hidden="true"><use href="#logo-mark"></use></svg>
            <span class="logo-word">Doneward</span>
        </a>

        <nav class="header-nav" aria-label="Main">
            {% if user.is_authenticated %}
            <a href="{% url 'home' %}" class="header-link{% if current == 'home' or current == 'add' or current == 'update' or current == 'complete' or current == 'trash' %} is-active{% endif %}">My tasks</a>
            <a href="{% url 'about' %}" class="header-link hide-sm{% if current == 'about' %} is-active{% endif %}">About</a>
            {% else %}
            <a href="{% url 'about' %}" class="header-link hide-sm{% if current == 'about' %} is-active{% endif %}">About</a>
            <a href="{% url 'login' %}" class="header-link{% if current == 'login' %} is-active{% endif %}">Log in</a>
            {% endif %}

            <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Switch theme" title="Switch light / dark">
                <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
                <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
            </button>

            {% if user.is_authenticated %}
            <span class="user-chip" title="Signed in as {{ user.username }}">
                <span class="avatar" aria-hidden="true">{{ user.username|first|upper }}</span>
                <span class="user-name">{{ user.username }}</span>
            </span>
            <form method="POST" action="{% url 'logout' %}" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="icon-btn" title="Log out" aria-label="Log out">
                    <svg class="icon" aria-hidden="true"><use href="#i-logout"></use></svg>
                </button>
            </form>
            {% else %}
            <a href="{% url 'register' %}" class="btn btn-ink btn-sm">
                Start free
                <svg class="icon icon-sm icon-arrow" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
            </a>
            {% endif %}
        </nav>
    </div>
</header>
{% endwith %}
