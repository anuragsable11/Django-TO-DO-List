{% load static %}
{% with current=request.resolver_match.url_name %}
<header class="nav">
    <a class="logo" href="{% url 'landing' %}">
        <img src="{% static 'images/to-do-list.png' %}" alt="">
        <span class="logo-text">TO-DO!</span>
    </a>
    <nav class="links" aria-label="Main">
        {% if user.is_authenticated %}
        <a href="{% url 'home' %}" class="{% if current == 'home' %}active{% endif %}">📋 Tasks</a>
        <a href="{% url 'add' %}" class="{% if current == 'add' %}active{% endif %}">➕ Add</a>
        <a href="{% url 'complete' %}" class="{% if current == 'complete' %}active{% endif %}">✅ Done</a>
        <a href="{% url 'trash' %}" class="{% if current == 'trash' %}active{% endif %}">🗑 Trash</a>
        <a href="{% url 'about' %}" class="{% if current == 'about' %}active{% endif %}">💬 About</a>
        <form method="POST" action="{% url 'logout' %}" class="nav-logout">
            {% csrf_token %}
            <button type="submit" title="Log out {{ user.username }}">🚪 Logout <span class="nav-user">{{ user.username }}</span></button>
        </form>
        {% else %}
        <a href="{% url 'about' %}" class="{% if current == 'about' %}active{% endif %}">💬 About</a>
        <a href="{% url 'login' %}" class="{% if current == 'login' %}active{% endif %}">🔑 Log in</a>
        <a href="{% url 'register' %}" class="nav-cta{% if current == 'register' %} active{% endif %}">🦸 Register</a>
        {% endif %}
    </nav>
</header>
{% endwith %}
