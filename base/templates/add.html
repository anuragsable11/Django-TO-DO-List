{% extends "main.html" %}

{% block title %}Add task{% endblock %}

{% block content %}

<section class="form-wrap">
    <form method="POST" class="panel form-panel">
        {% csrf_token %}
        <h1 class="form-title">New Mission!</h1>
        <p class="page-sub">What's the next thing you'll conquer?</p>

        <label for="title">Title</label>
        <input id="title" type="text" name="title" maxlength="30" required autofocus
               placeholder="Save the city">

        <label for="desc">Description</label>
        <input id="desc" type="text" name="desc" maxlength="30"
               placeholder="Before lunch, ideally">

        <div class="form-actions">
            <button type="submit" class="btn btn-green">💥 Add task</button>
            <a href="{% url 'home' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
